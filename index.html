<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Forge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cookie&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 class="sidebar-title">task Forge</h2>
          <div
            class="mode-toggle toggle-btn"
            aria-label="Toggle dark mode"
            title="dark/light mode"
          ></div>
        </div>

        <nav class="sidebar-nav">
          <ul class="sidebar-list">
            <li class="sidebar-item">
              <span class="sidebar-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  width="30"
                  height="30"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
                  />
                </svg>
              </span>
              <a href="#add-task" class="sidebar-link">Add Task</a>
            </li>

            <li class="sidebar-item today">
              <span class="sidebar-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1"
                  stroke="currentColor"
                  width="30"
                  height="30"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"
                  />
                  <text
                    x="12"
                    y="18"
                    id="dateText"
                    font-size="9"
                    font-weight="100"
                    fill="none"
                    text-anchor="middle"
                  ></text>
                </svg>
              </span>
              <a href="#today_task" class="sidebar-link">Today</a>
            </li>

            <li class="sidebar-item">
              <span class="sidebar-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  width="30"
                  height="30"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z"
                  />
                </svg>
              </span>
              <a href="#upcoming_task" class="sidebar-link">Upcoming</a>
            </li>

            <li class="sidebar-item">
              <span class="sidebar-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  height="30"
                  width="30"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
                  />
                </svg>
              </span>
              <a href="#completed_task" class="sidebar-link">Completed</a>
            </li>
          </ul>
        </nav>
      </aside>

      <div
        class="sidebar-toggle toggle-btn"
        title="open/close sidebar"
        aria-label="Toggle sidebar"
      ></div>
    </div>

    <!-- <main class="container">
      <form class="task-form" method="post">
        <input
          type="text"
          name="task"
          id="task-input"
          placeholder="Add new task"
        />
        <button type="submit">Add</button>
      </form>
      <div class="taskPanel"></div>
    </main> -->

    <!-- <footer><input type="date" name="date" id="task-date" /></footer> -->
  </body>
  <script src="src/mode-toggle.js"></script>
  <script src="src/sidebar-toggle.js"></script>
</html>
